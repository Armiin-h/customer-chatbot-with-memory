services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Always reach host Ollama from the container (ignore local .env localhost)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DATABASE_URL: sqlite:///./data/chat_history.db
      MEMORY_WINDOW_SIZE: ${MEMORY_WINDOW_SIZE:-10}
    volumes:
      - chat_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls same origin; nginx proxies /api → api:8000
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  chat_data:
